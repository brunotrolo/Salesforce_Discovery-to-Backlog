<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="Salesforce Discovery-to-Backlog">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B4C8C"/>
      <stop offset="0.55" stop-color="#032D60"/>
      <stop offset="1" stop-color="#00132E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00A1E0"/>
      <stop offset="1" stop-color="#22E3C6"/>
    </linearGradient>
  </defs>

  <rect width="960" height="260" rx="24" fill="url(#bg)"/>

  <!-- discovery glyph: conversation (left) becoming a checked backlog (right) -->
  <g transform="translate(60 66)" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 8 H64 a12 12 0 0 1 12 12 V52 a12 12 0 0 1 -12 12 H40 L24 80 V64 H14 a12 12 0 0 1 -12 -12 V20 a12 12 0 0 1 12 -12 Z"/>
    <path d="M96 36 L102 42 L112 30" stroke-width="7"/>
    <path d="M96 62 L102 68 L112 56" stroke-width="7"/>
    <path d="M96 94 L102 100 L112 88" stroke-width="7"/>
    <g stroke="#7FD3F2" stroke-width="8">
      <line x1="126" y1="36" x2="160" y2="36"/><line x1="126" y1="62" x2="160" y2="62"/><line x1="126" y1="94" x2="160" y2="94"/>
    </g>
  </g>

  <!-- title + tagline -->
  <text x="248" y="112" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">Salesforce Discovery-to-Backlog</text>
  <text x="250" y="150" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#BCD5F0">Do discovery ao Jira &#8212; sem requisito sem fonte.</text>

  <!-- pills -->
  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">
    <rect x="250" y="176" width="118" height="30" rx="15" fill="#04203F" stroke="#22E3C6" stroke-opacity="0.55"/>
    <text x="309" y="196" fill="#22E3C6" text-anchor="middle">7 agentes</text>

    <rect x="380" y="176" width="220" height="30" rx="15" fill="#04203F" stroke="#00A1E0" stroke-opacity="0.55"/>
    <text x="490" y="196" fill="#7FD3F2" text-anchor="middle">Rastre&#225;vel por fonte</text>

    <rect x="612" y="176" width="200" height="30" rx="15" fill="#04203F" stroke="#8AA9D6" stroke-opacity="0.45"/>
    <text x="712" y="196" fill="#BCD5F0" text-anchor="middle">Jira com aprova&#231;&#227;o</text>
  </g>
</svg>
