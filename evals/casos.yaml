- id: EV-013
  titulo: Transcrição vira backlog com aceite e fonte
  tipo: positivo
  critico: false
  camada: modelo
  fixture: fixtures/vazio
  pedido: 'Transforme esta transcrição em backlog: "A atendente precisa ver o histórico do cliente antes de responder. O prazo de resposta para prioridade alta é de 1 hora."'
  esperado: []
  juiz:
    rubrica: A resposta começa por `odin ensure sf-discovery`, gera histórias com critérios de aceite em Dado/Quando/Então, cita a fonte de cada regra de negócio e registra perguntas em aberto em vez de inventar requisitos.
